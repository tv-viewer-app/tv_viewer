name: tv_viewer
description: TV Viewer - IPTV Streaming App for Android
publish_to: 'none'
version: 2.22.4+132

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  # HTTP & Networking
  http: ^1.2.0
  
  # Video Player - use basic video_player, skip chewie
  video_player: ^2.8.2
  
  # Audio Player - background-capable audio for radio streams
  just_audio: ^0.9.39
  audio_service: ^0.18.18
  audio_session: ^0.1.21
  
  # State Management
  provider: ^6.1.1
  
  # Dependency Injection
  get_it: ^7.6.4
  
  # Storage
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  
  # Utils
  url_launcher: ^6.3.2
  intl: ^0.20.2
  open_filex: ^4.5.0
  
  # Cryptography (SHA-256 hashing for analytics & shared DB)
  crypto: ^3.0.3
  
  # Android-specific features
  wakelock_plus: ^1.2.0
  # floating: ^6.0.0  # PiP - temporarily disabled for Flutter 3.32 compat
  
  # Cached images for channel logos (#147)
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  
  # Device & Connectivity Info (BL-024, BL-032)
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  
  # Share functionality (BL-024)
  share_plus: ^9.0.0
  
  # World Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
