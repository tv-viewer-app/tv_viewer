Builds:
  - versionName: 2.24.2
    versionCode: 1361
    commit: 0b0eb4e333130112f1aab88b80c85e3ff0b6f7dd
    subdir: flutter_app
    sudo:
      - mkdir -p /home/runner/work/tv_viewer
      - chown -R vagrant /home/runner
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/tv-viewer-app/tv_viewer/releases/download/v%v/TV_Viewer_v%v_fdroid-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - flutter_app/ios
      - flutter_app/linux
      - flutter_app/macos
      - flutter_app/web
      - flutter_app/windows
    prebuild:
      - git -C $$flutter$$ checkout -q -f 3.44.4
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - flutter_app/.pub-cache
    build:
      - export repo=/home/runner/work/tv_viewer/tv_viewer
      - cd ../..
      - export ORIG=$(pwd)
      - mv app.tvviewer.player $repo
      - cd $repo/flutter_app
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
        --no-tree-shake-icons
      - cd $ORIG
      - mv $repo app.tvviewer.player

