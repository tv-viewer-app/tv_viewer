<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width: 320px; padding: 16px; font-family: 'Segoe UI', sans-serif; background: #1c1b1f; color: #fff; margin: 0; }
h2 { font-size: 18px; margin: 0 0 12px; }
p { color: #b3b3b3; font-size: 13px; margin: 0 0 16px; }
a.btn { display: block; background: #1565C0; color: #fff; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px; }
a.btn:hover { background: #1976D2; }
.info { font-size: 11px; color: #666; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<h2>📺 TV Viewer</h2>
<p>21,000+ live TV and radio channels from 100+ countries. Free, open-source, no ads.</p>
<a class="btn" href="https://tv-viewer-app.github.io/tv_viewer/" target="_blank">Open TV Viewer</a>
<div class="info">
<p>Or self-host with Docker:<br><code>docker run -p 8765:8765 asummoner/tvviewerapp</code></p>
</div>
</body>
</html>
