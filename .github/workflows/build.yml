# =============================================================================
# Build — Parallel platform builds (Windows EXE + Android APK)
# =============================================================================
# Replaces: android-build.yml, build-windows.yml, build-ubuntu.yml,
#           build-release.yml
#
# Triggers:
#   - Push to master (when source files change, not docs)
#   - Manual dispatch
#   - Called by release.yml via workflow_call
#
# Produces named artifacts that release.yml downloads.
# Does NOT commit binaries back to the repo (avoids repo bloat + push races).
# =============================================================================

name: Build

on:
  # DISABLED auto-trigger to save Actions storage (0.5GB limit reached)
  # push:
  #   branches: [master]
  #   tags-ignore:
  #     - 'v*'
  #   paths:
  #     - 'flutter_app/**'
  #     - 'core/**'
  #     - 'ui/**'
  #     - 'utils/**'
  #     - '*.py'
  #     - 'requirements.txt'
  #     - 'TV_Viewer.spec'
  #     - '!**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to upload assets to (e.g., v2.4.0)'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag to upload assets to (e.g., v2.4.0)'
        required: false
        type: string
    # Expose artifact names so the caller (release.yml) knows what to download
    outputs:
      windows-artifact:
        description: Name of the Windows artifact
        value: windows-exe
      android-artifact:
        description: Name of the Android APK artifact
        value: android-apk
      android-aab-artifact:
        description: Name of the Android AAB artifact
        value: android-aab

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Cancel redundant builds on the same branch
# ---------------------------------------------------------------------------
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Windows — PyInstaller → TV_Viewer.exe
  # ===========================================================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'  # Caches pip download dir keyed on requirements.txt hash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # channels.json is auto-generated at runtime and gitignored, but
      # PyInstaller's --add-data needs the file to exist at build time
      # (Issue #174). An empty list is a valid initial state.
      - name: Ensure channels.json placeholder
        shell: pwsh
        run: |
          if (-not (Test-Path "channels.json")) {
            "[]" | Out-File -FilePath "channels.json" -Encoding utf8 -NoNewline
            Write-Host "Created placeholder channels.json"
          }

      # Generate Windows VERSIONINFO so SmartScreen / cloud-reputation treats
      # the EXE as a properly-published binary rather than "unknown" (#190).
      - name: Generate version_info.txt
        shell: pwsh
        run: |
          python -c "from build import write_version_file; write_version_file('version_info.txt')"
          if (Test-Path version_info.txt) { Write-Host "✅ version_info.txt generated" } else { Write-Error "❌ version_info.txt missing"; exit 1 }

      # Download portable VLC and bundle libvlc.dll + plugins so the EXE
      # works on a clean Windows install with NO VLC prerequisite (#200).
      # Adds ~70 MB to the EXE folder; well worth eliminating the install
      # blocker that bit ~half of new users.
      - name: Download portable VLC for libvlc bundling
        shell: pwsh
        run: |
          $vlcVersion = "3.0.20"
          $url = "https://download.videolan.org/pub/videolan/vlc/$vlcVersion/win64/vlc-$vlcVersion-win64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile vlc.zip -UseBasicParsing
          Expand-Archive -Path vlc.zip -DestinationPath vlc-extracted -Force
          $vlcDir = Get-ChildItem vlc-extracted -Directory | Select-Object -First 1
          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "vlc-portable"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item "$($vlcDir.FullName)\libvlc.dll"     $bundleDir
          Copy-Item "$($vlcDir.FullName)\libvlccore.dll" $bundleDir
          Copy-Item "$($vlcDir.FullName)\plugins" $bundleDir -Recurse
          $size = [math]::Round((Get-ChildItem $bundleDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 2)
          Write-Host "✅ libvlc bundle staged at $bundleDir ($size MB)"
          # Expose to PyInstaller spec
          "BUNDLE_LIBVLC_DIR=$bundleDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Build using TVViewer.spec — the spec bundles customtkinter assets via
      # collect_data_files('customtkinter'). Building with raw CLI flags (the
      # previous approach) silently dropped CTK theme JSONs and caused v2.9.4
      # OSD invisibility bug. NEVER replace this with inline --hidden-import.
      - name: Build EXE from spec
        run: python -m PyInstaller TVViewer.spec --noconfirm

      - name: Verify build + bundled assets
        shell: pwsh
        run: |
          $exe = "dist\TVViewer\TVViewer.exe"
          if (-not (Test-Path $exe)) { Write-Error "❌ $exe not found"; exit 1 }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "✅ EXE built: $size MB"

          # customtkinter theme JSONs MUST be bundled or OSD breaks (v2.9.4 bug)
          $internalDir = "dist\TVViewer\_internal\customtkinter"
          if (Test-Path $internalDir) {
            $themes = Get-ChildItem -Recurse $internalDir -Filter "*.json" -ErrorAction SilentlyContinue
          } else {
            $themes = Get-ChildItem -Recurse "dist\TVViewer" -Filter "*.json" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'customtkinter' }
          }
          if ($themes.Count -lt 3) {
            Write-Error "❌ customtkinter assets missing ($($themes.Count) themes) — OSD will be invisible. Check TVViewer.spec collect_data_files('customtkinter')"
            exit 1
          }
          Write-Host "✅ customtkinter assets bundled ($($themes.Count) theme files)"

          # libvlc must be bundled (#200) so app works on clean Windows installs
          $libvlc = "dist\TVViewer\libvlc.dll"
          if (-not (Test-Path $libvlc)) {
            Write-Error "❌ libvlc.dll not bundled — set BUNDLE_LIBVLC_DIR in CI"
            exit 1
          }
          $plugins = (Get-ChildItem "dist\TVViewer\plugins" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue).Count
          Write-Host "✅ libvlc bundled ($plugins plugin DLLs)"

      - name: Package EXE folder for release
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\TVViewer\*" -DestinationPath "dist\TV_Viewer-windows.zip" -Force
          Write-Host "✅ Packaged: dist\TV_Viewer-windows.zip"

      - name: Upload to Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = "$env:INPUT_VERSION"
          if ($version -and $version -match '^v?[0-9]+\.[0-9]+\.[0-9]+') {
            # Ensure release exists (publish job may not have run yet)
            gh release view $version 2>$null
            if ($LASTEXITCODE -ne 0) {
              gh release create $version --title "TV Viewer $version" --notes "Release in progress — notes will be updated when publish job completes." --draft=false
            }
            gh release upload $version dist/TV_Viewer-windows.zip --clobber
          }
        shell: pwsh

      # Keep artifact upload as fallback but don't fail on quota
      - name: Upload artifact (optional)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        continue-on-error: true
        with:
          name: windows-exe
          path: dist/TV_Viewer-windows.zip
          retention-days: 1

  # ===========================================================================
  # Job 2: Android — Flutter → app-release.apk
  # ===========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # --- Java 17 (required by AGP / Gradle) ---
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: '17'

      # --- Flutter SDK (cached between runs) ---
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # --- Gradle cache (wrapper + dependency jars) ---
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('flutter_app/android/**/*.gradle*', 'flutter_app/pubspec.lock') }}
          restore-keys: gradle-

      # --- Pub cache ---
      - name: Cache pub packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('flutter_app/pubspec.lock') }}
          restore-keys: pub-

      - name: Get dependencies
        run: flutter pub get

      # --- Decode signing keystore from secret (skipped if secret missing) ---
      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "✅ Signing keystore configured"

      # Build AAB (Play Store) and APK (sideload + GitHub Release)
      # AAB is required by Play Store for new uploads since 2021.
      - name: Build APK + AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify outputs
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          [ -f "$APK" ] && echo "✅ APK: $(du -h $APK | cut -f1)" || { echo "❌ APK missing"; exit 1; }
          [ -f "$AAB" ] && echo "✅ AAB: $(du -h $AAB | cut -f1)" || { echo "❌ AAB missing"; exit 1; }

      - name: Upload to Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$INPUT_VERSION"
          APK_PATH=$(find build/app/outputs/flutter-apk -name "app-release.apk" | head -1)
          AAB_PATH=$(find build/app/outputs/bundle/release -name "app-release.aab" | head -1)
          if [ -n "$VERSION" ]; then
            if ! gh release view "$VERSION" >/dev/null 2>&1; then
              gh release create "$VERSION" --title "TV Viewer $VERSION" --notes "Release in progress — notes will be updated when publish job completes."
            fi
            if [ -n "$APK_PATH" ]; then
              cp "$APK_PATH" "/tmp/TV_Viewer_${VERSION}_Android.apk"
              gh release upload "$VERSION" "/tmp/TV_Viewer_${VERSION}_Android.apk" --clobber
            fi
            if [ -n "$AAB_PATH" ]; then
              cp "$AAB_PATH" "/tmp/TV_Viewer_${VERSION}_Android.aab"
              gh release upload "$VERSION" "/tmp/TV_Viewer_${VERSION}_Android.aab" --clobber
            fi
          fi

      # Keep artifact upload as fallback (play-store.yml downloads from here)
      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        continue-on-error: true
        with:
          name: android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        continue-on-error: true
        with:
          name: android-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # ===========================================================================
  # Job 3: Ubuntu — PyInstaller → TV_Viewer (Linux binary)
  # ===========================================================================
  build-ubuntu:
    name: Build Ubuntu Binary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python build.py --onefile

      - name: Verify build
        run: |
          if [ -f "dist/TV_Viewer" ]; then
            SIZE=$(du -h "dist/TV_Viewer" | cut -f1)
            echo "✅ Build successful — $SIZE"
          else
            echo "❌ dist/TV_Viewer not found"
            exit 1
          fi

      - name: Upload to Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -n "$VERSION" ]; then
            if ! gh release view "$VERSION" >/dev/null 2>&1; then
              gh release create "$VERSION" --title "TV Viewer $VERSION" --notes "Release in progress — notes will be updated when publish job completes."
            fi
            mv dist/TV_Viewer "dist/TV_Viewer_${VERSION}_linux_x86_64"
            gh release upload "$VERSION" "dist/TV_Viewer_${VERSION}_linux_x86_64" --clobber
          fi

      # Keep artifact upload as fallback but don't fail on quota
      - name: Upload artifact (optional)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        continue-on-error: true
        with:
          name: ubuntu-binary
          path: dist/TV_Viewer*
          retention-days: 1
