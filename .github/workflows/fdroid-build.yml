# =============================================================================
# F-Droid Build — Builds developer-signed reproducible APKs for F-Droid
# =============================================================================
# F-Droid rebuilds these APKs without the signing key and verifies that their
# unsigned contents match the developer-signed release assets byte-for-byte.
# =============================================================================

name: F-Droid Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v2.16.8)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get --enforce-lockfile

      - name: Decode release signing keystore
        working-directory: flutter_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build reproducible ABI APKs
        working-directory: flutter_app
        run: |
          flutter build apk --release \
            --split-per-abi \
            --no-tree-shake-icons

      - name: Rename ABI APKs
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            SOURCE="flutter_app/build/app/outputs/flutter-apk/app-${ABI}-release.apk"
            TARGET="TV_Viewer_v${VERSION}_fdroid-${ABI}.apk"
            test -f "$SOURCE"
            cp "$SOURCE" "$TARGET"
          done
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fdroid-apks
          path: TV_Viewer_v${{ env.VERSION }}_fdroid-*.apk
          retention-days: 90

      - name: Attach to release (if tag-triggered)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "TV Viewer ${{ github.ref_name }}" \
              --notes "Release in progress" --draft
          fi
          gh release upload "${{ github.ref_name }}" \
            TV_Viewer_v${{ env.VERSION }}_fdroid-*.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
