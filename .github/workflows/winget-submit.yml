name: WinGet Submit

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 2.21.1)'
        required: true

jobs:
  submit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Install wingetcreate
        shell: pwsh
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit to WinGet
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $url = "https://github.com/tv-viewer-app/tv_viewer/releases/download/v${version}/TV_Viewer-windows.zip"

          if (-not $env:WINGET_TOKEN) {
            Write-Host "::error::WINGET_GITHUB_TOKEN not set"
            exit 1
          }

          # Try update first (for existing packages)
          Write-Host "Attempting update for TVViewerApp.TVViewer..."
          ./wingetcreate.exe update TVViewerApp.TVViewer `
            --version $version `
            --urls $url `
            --submit `
            --token $env:WINGET_TOKEN
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Update failed — attempting new package submission..."
            # First submission: wingetcreate new only accepts URL + output dir
            # We generate manifests locally then submit
            ./wingetcreate.exe new $url `
              --out manifests `
              --token $env:WINGET_TOKEN
            
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::Interactive 'new' failed. Creating manifest manually..."
              
              # Create manifest directory structure manually
              $manifestDir = "manifests\t\TVViewerApp\TVViewer\$version"
              New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
              
              # Version manifest
              @"
PackageIdentifier: TVViewerApp.TVViewer
PackageVersion: $version
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.6.0
"@ | Out-File -FilePath "$manifestDir\TVViewerApp.TVViewer.yaml" -Encoding utf8

              # Installer manifest
              @"
PackageIdentifier: TVViewerApp.TVViewer
PackageVersion: $version
InstallerType: zip
Installers:
  - Architecture: x64
    InstallerUrl: $url
    InstallerSha256: $($(Get-FileHash -Algorithm SHA256 -InputStream ([System.Net.WebClient]::new().OpenRead($url))).Hash)
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: TVViewer\TVViewer.exe
        PortableCommandAlias: tvviewer
ManifestType: installer
ManifestVersion: 1.6.0
"@ | Out-File -FilePath "$manifestDir\TVViewerApp.TVViewer.installer.yaml" -Encoding utf8

              # Locale manifest
              @"
PackageIdentifier: TVViewerApp.TVViewer
PackageVersion: $version
PackageLocale: en-US
Publisher: TVViewerApp
PackageName: TV Viewer
License: MIT
ShortDescription: Cross-platform IPTV streaming application
Description: Free IPTV streaming — 21,000+ live TV and radio channels from 100+ countries. No ads, no account needed.
PackageUrl: https://github.com/tv-viewer-app/tv_viewer
LicenseUrl: https://github.com/tv-viewer-app/tv_viewer/blob/master/LICENSE
Tags:
  - iptv
  - streaming
  - tv
  - radio
  - vlc
ManifestType: defaultLocale
ManifestVersion: 1.6.0
"@ | Out-File -FilePath "$manifestDir\TVViewerApp.TVViewer.locale.en-US.yaml" -Encoding utf8

              Write-Host "Created manifest files in $manifestDir"
              Get-ChildItem $manifestDir
              
              # Submit using wingetcreate submit
              ./wingetcreate.exe submit manifests `
                --token $env:WINGET_TOKEN
              
              if ($LASTEXITCODE -ne 0) {
                Write-Host "::error::Manifest submission failed"
                exit 1
              }
            }
          }
          Write-Host "✅ WinGet submission successful"
