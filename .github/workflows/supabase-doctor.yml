name: Supabase Doctor

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/supabase_doctor.py'
      - 'scripts/supabase_migration_v2.16.*.sql'
      - '.github/workflows/supabase-doctor.yml'

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run schema doctor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/supabase_doctor.py
