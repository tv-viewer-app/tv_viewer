name: 📊 Supabase Analytics Report

on:
  workflow_dispatch:
    inputs:
      min_version:
        description: 'Minimum app version to include (e.g., 2.6.0)'
        required: false
        default: '2.6.0'
      days:
        description: 'Number of days to look back'
        required: false
        default: '30'

permissions:
  contents: read

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Validate inputs
        env:
          MIN_VERSION: ${{ inputs.min_version }}
          DAYS_BACK: ${{ inputs.days }}
        run: |
          if [[ ! "$MIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid min_version format: $MIN_VERSION"
            exit 1
          fi
          if [[ ! "$DAYS_BACK" =~ ^[0-9]+$ ]] || [ "$DAYS_BACK" -gt 365 ]; then
            echo "❌ Invalid days value: $DAYS_BACK (must be 1-365)"
            exit 1
          fi

      - name: Run analytics query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MIN_VERSION: ${{ inputs.min_version }}
          DAYS_BACK: ${{ inputs.days }}
        run: python scripts/supabase_analytics_report.py

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: analytics-report-${{ github.run_number }}
          path: /tmp/analytics-report.json
          retention-days: 90
