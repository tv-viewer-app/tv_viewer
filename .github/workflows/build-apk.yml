name: Build APK

on:
  # Disabled tag trigger — release-gate.yml + build.yml now own the v* tag flow
  # and produce the canonical TV_Viewer_v<version>_Android.apk/.aab assets.
  # Keep workflow_dispatch only for manual ad-hoc builds.
  workflow_dispatch:

permissions: {}  # Deny all by default

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.44.4'
          channel: stable

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — release would be signed with debug key"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > flutter_app/android/app/upload-keystore.jks
          cat > flutter_app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          # Log keystore alias for debugging (don't verify SHA1 — trust the secret)
          keytool -list -keystore flutter_app/android/app/upload-keystore.jks \
                  -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | head -5 || true
          echo "✅ Keystore decoded"

      - name: Install dependencies
        run: cd flutter_app && flutter pub get

      - name: Build release APK
        run: cd flutter_app && flutter build apk --release

      - name: Build release App Bundle (AAB) for Play Store
        run: cd flutter_app && flutter build appbundle --release

      # --- Tag push: create a GitHub Release with the APK attached ---
      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk \
             "flutter_app/build/app/outputs/flutter-apk/tv-viewer-${TAG_NAME}.apk"
          cp flutter_app/build/app/outputs/bundle/release/app-release.aab \
             "flutter_app/build/app/outputs/bundle/release/tv-viewer-${TAG_NAME}.aab"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            flutter_app/build/app/outputs/flutter-apk/tv-viewer-*.apk
            flutter_app/build/app/outputs/bundle/release/tv-viewer-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Manual dispatch: upload APK + AAB as workflow artifacts ---
      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tv-viewer-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact (Play Store)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tv-viewer-aab
          path: flutter_app/build/app/outputs/bundle/release/app-release.aab
