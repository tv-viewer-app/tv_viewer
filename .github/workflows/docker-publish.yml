name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., latest, v2.13.1)'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: asummoner/tvviewerapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name || github.ref }}

    - name: Set up QEMU (multi-arch)
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract version from tag
      id: meta
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          RAW="${{ github.event.inputs.tag }}"
        else
          RAW="${{ github.event.release.tag_name }}"
        fi
        VERSION="${RAW#v}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$VERSION" != "latest" ]; then
          echo "::error::Invalid image version: $RAW"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and push (multi-arch)
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          ${{ env.IMAGE_NAME }}:latest
        build-args: |
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        labels: |
          org.opencontainers.image.title=TV Viewer Web
          org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          org.opencontainers.image.source=https://github.com/tv-viewer-app/tv_viewer

    - name: Update Docker Hub description
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ${{ env.IMAGE_NAME }}
        readme-filepath: ./DOCKER_README.md
        short-description: "Lightweight IPTV streaming web app | 16,000+ channels | NAS-ready | Browser-based"
