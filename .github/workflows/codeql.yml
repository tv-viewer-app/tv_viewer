# =============================================================================
# CodeQL — GitHub-native security scanning (free for public repos)
# =============================================================================
# Catches: SQL injection, command injection, path traversal, hardcoded creds,
# unsafe deserialization, XSS — across Python.
# Java/Kotlin analysis is disabled: the Flutter android/ wrapper is generated
# boilerplate and Autobuild fails consistently with no actionable signal.
# Re-enable if/when we add real Kotlin code under android/.
# =============================================================================

name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - '**/*.py'
  pull_request:
    branches: [master]
    paths:
      - '**/*.py'
  schedule:
    - cron: '23 4 * * 1'  # Monday 04:23 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
