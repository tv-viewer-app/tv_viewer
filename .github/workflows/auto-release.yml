# =============================================================================
# Auto-Release — Creates a release when version is bumped on master
# =============================================================================
# Detects version changes in config.py or pubspec.yaml on push to master.
# If version changed, automatically creates a tag and triggers the release flow.
#
# This eliminates the manual "git tag v2.x.x && git push origin v2.x.x" step.
# =============================================================================

name: Auto-Release

on:
  push:
    branches: [master]
    paths:
      - 'config.py'
      - 'flutter_app/pubspec.yaml'

permissions:
  contents: write

jobs:
  detect-and-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to diff

      - name: Check if version changed
        id: version_check
        run: |
          # Extract current version from config.py
          CURRENT_VERSION=$(grep -oP "APP_VERSION\s*=\s*['\"]?\K[0-9]+\.[0-9]+\.[0-9]+" config.py || echo "")
          
          # Extract previous version
          git show HEAD~1:config.py > /tmp/prev_config.py 2>/dev/null || echo ""
          PREV_VERSION=$(grep -oP "APP_VERSION\s*=\s*['\"]?\K[0-9]+\.[0-9]+\.[0-9]+" /tmp/prev_config.py 2>/dev/null || echo "")
          
          echo "current=$CURRENT_VERSION"
          echo "previous=$PREV_VERSION"
          
          if [ -n "$CURRENT_VERSION" ] && [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=v$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "✅ Version bumped: $PREV_VERSION → $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No version change detected"
          fi

      - name: Check tag doesn't already exist
        if: steps.version_check.outputs.changed == 'true'
        id: tag_check
        run: |
          TAG="${{ steps.version_check.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG already exists, skipping"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.version_check.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version_check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (auto-tagged)"
          git push origin "$TAG"
          echo "🏷️ Created and pushed tag: $TAG"
          echo "## 🚀 Auto-Release Triggered" >> $GITHUB_STEP_SUMMARY
          echo "Tag \`$TAG\` created. Release Gate workflow will validate and publish." >> $GITHUB_STEP_SUMMARY
