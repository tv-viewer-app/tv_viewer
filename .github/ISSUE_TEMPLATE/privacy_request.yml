name: 🔒 General privacy question
description: Non-sensitive question about the privacy policy
title: "[Privacy] "
labels: ["privacy"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contacting us about privacy. Please review our [Privacy Policy](https://tv-viewer-app.github.io/tv_viewer/privacy.html) first — most questions (what we collect, how to opt out of analytics, how to erase local data) are answered there.

        ⚠️ This is a public issue. Do not post personal information, private stream URLs, install identifiers, or data-subject requests here. For a private privacy or deletion request, email **tvviewerapp@proton.me**. Use a [private security advisory](https://github.com/tv-viewer-app/tv_viewer/security/advisories/new) only for security vulnerabilities.
  - type: dropdown
    id: kind
    attributes:
      label: Type of request
      options:
        - General privacy-policy question
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Ask a non-sensitive question about the published policy. Use the private email above for personal data requests.
      placeholder: Do not include personal information, identifiers, or stream URLs.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have read the [Privacy Policy](https://tv-viewer-app.github.io/tv_viewer/privacy.html)
          required: true
        - label: I am not posting personal information that I would not want to be public
          required: true
