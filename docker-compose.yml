version: "3.8"

services:
  tv-viewer-web:
    build: .
    image: tv-viewer-web:latest
    container_name: tv-viewer
    ports:
      - "8765:8765"
    volumes:
      - ./channels.json:/app/channels.json:ro
      - ./channels_config.json:/app/channels_config.json:ro
    environment:
      - TV_VIEWER_WEB_PORT=8765
      - TZ=Asia/Jerusalem
    restart: unless-stopped
    # NAS-friendly resource limits (runs on 512MB RAM devices)
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 48M
          cpus: "0.1"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
