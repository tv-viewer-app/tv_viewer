# TV Viewer - Docker Compose
# Usage: docker compose up -d
# Access: http://localhost:8765

services:
  tv-viewer:
    image: asummoner/tvviewerapp:latest
    container_name: tv-viewer
    ports:
      - "8765:8765"
    volumes:
      - tv-viewer-data:/data
    environment:
      - TZ=${TZ:-UTC}
      - TV_VIEWER_WEB_PORT=8765
      - DATA_DIR=/data
      - TELEMETRY_ENABLED=true
      - SUPABASE_URL=${SUPABASE_URL:-https://cdtxpefohpwtusmqengu.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkdHhwZWZvaHB3dHVzbXFlbmd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0NzE4MzYsImV4cCI6MjA4ODA0NzgzNn0.FuzUDNIfxlGHptAZ0vWT4_8BDDEcy9CcSCY3te7_wMo}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/status')"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  tv-viewer-data:
